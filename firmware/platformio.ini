[platformio]
default_envs = telemetry_cb
boards_dir = boards

[env]
platform = platformio/ststm32@19.0.0
board = pwmvid_g431cb
framework = stm32cube
platform_packages =
  platformio/framework-stm32cubeg4@1.6.3
  platformio/toolchain-gccarmnoneeabi@1.70201.0
  platformio/tool-ldscripts-ststm32@0.2.0
board_build.stm32cube.custom_config_header = yes
board_build.stm32cube.custom_system_setup = yes
board_build.ldscript = ld/STM32G431CBTX_FLASH.ld
build_type = release
build_flags =
  -Os
  -flto
  -Wall
  -Wextra
  -Werror=implicit-function-declaration
  -D HSE_VALUE=8000000U
  -D USER_VECT_TAB_ADDRESS
  -D USE_HAL_DRIVER
  -D PWMVID_DRAFT=1
  -D PWMVID_USB_UPDATER=1
  -D VECT_TAB_OFFSET=0x2000U
  -I lib/control
  -I lib/sequence
  -Wl,-Map,${BUILD_DIR}/firmware.map
extra_scripts = pre:scripts/cube_usb.py
lib_ldf_mode = chain+

[env:telemetry_cb]
build_flags = ${env.build_flags} -D PWMVID_ALLOW_FIXTURE=0

[env:fixture_cb]
build_flags = ${env.build_flags} -D PWMVID_ALLOW_FIXTURE=1 -D PWMVID_SEQUENCE=1

; Temporary GPU-disconnected sequencer check. The normal fixture_cb release
; keeps its real GPU capture path and is packaged separately.
[env:sequencer_bench_cb]
build_flags = ${env.build_flags} -D PWMVID_ALLOW_FIXTURE=1 -D PWMVID_SEQUENCE=1 -D PWMVID_SEQUENCE_BENCH=1

; Size comparison only: output-capable CB app without the sequence executor.
; This image is not packaged for installation.
[env:size_probe_cb]
build_flags = ${env.build_flags} -D PWMVID_ALLOW_FIXTURE=1

[workspace]
resolver = "3"
members = ["crates/contract", "crates/waveform", "crates/leaf-api", "crates/gpu0-capture", "crates/gpu0-analysis"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
uuid = { version = "1.24.0", features = ["serde", "v4", "v5"] }
